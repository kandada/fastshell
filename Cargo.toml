[package]
name = "fastshell"
version = "0.3.0"
edition = "2021"
description = "Lightweight Bash + Python runtime SDK for mobile AI agents"
license = "Apache-2.0"
authors = ["xiefujin <490021684@qq.com>"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
git = ["git2", "openssl"]
# Optional standalone python_bridge module (see src/python_bridge.rs):
# exposes fastshell to CPython via PyO3 (desktop embedding).
python = ["pyo3"]
# Embedded RustPython interpreter (pure Rust, no dlopen/JNI/C deps): the
# mobile python engine replacing the former Chaquopy CPython integration.
# The LGPL malachite dependencies are replaced by clean-room shims — see
# fastshell/num_bigint/README.md and the workspace [patch.crates-io].
python-rustpython = [
    "rustpython-vm",
    "rustpython-stdlib",
    "rustpython-pylib",
]
# Direct-JNI cdylib path (方案 A): exports Java_com_fastshell_Sdk_* symbols
# from Rust. Leave OFF for the staticlib + NDK CMake path (方案 B, fastshell_c),
# where the JNI layer lives in C (jni_glue.c) and Rust exposes only pure C ABI.
jni_direct = ["jni"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "latency"
harness = false
path = "benches/latency.rs"

[[bench]]
name = "throughput"
harness = false
path = "benches/throughput.rs"

[dependencies]
filetime = "0.2"
libc = "0.2"
ureq = "2"
rustls = "0.23"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
flate2 = "1"
tar = "0.4"
git2 = { version = "0.18", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
libloading = "0.8"
russh = "0.46"
russh-keys = "0.46"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "0.6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
sha1 = "0.10"
num_cpus = "1"
liblzma = "0.4"  # xz2 fork; shares liblzma-sys with rustpython-stdlib (no native-lib link conflict)
sha3 = "0.10"
bzip2 = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
jni = { version = "0.21", optional = true }
pyo3 = { version = "0.22", optional = true }
# Embedded RustPython (feature "python-rustpython"). Version pinned exactly —
# upgrades must follow the audit checklist in fastshell/vendor/README.md.
rustpython-vm = { version = "=0.5.0", default-features = false, features = ["compiler", "freeze-stdlib", "threading", "importlib", "encodings", "host_env", "stdio", "gc"], optional = true }
rustpython-stdlib = { version = "=0.5.0", default-features = false, features = ["threading", "compiler"], optional = true }
rustpython-pylib = { version = "=0.5.0", features = ["freeze-stdlib"], optional = true }
